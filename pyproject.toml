[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcio"
authors = [
    {name = "UKAEA"},
]
description = "Build Monte Carlo radiation transport models in Python, convert CAD to CSG, and write MCNP and OpenMC inputs"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0b1"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "setuptools",
    "rich",
    "tqdm"
]

[project.urls]
Documentation = "https://ukaea.github.io/mcio/"
Source = "https://github.com/ukaea/mcio"
Issues = "https://github.com/ukaea/mcio/issues"

[tool.setuptools]
packages = ["mcio"]

[tool.setuptools.package-data]
"mcio" = ["data/*.txt", "data/*.json"]

[project.optional-dependencies]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
    "myst-parser>=4",
    "linkify-it-py",
    "sphinx-copybutton",
]
dev = ["ruff==0.17.3", "pytest", "pytest-cov", "cadquery"]
cad = ["cadquery"]
jupyter = ["jupyter", "jupyter-cadquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# unitutils.py lives in tests/, the reference CAD models in models/
pythonpath = ["tests", "models"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["mcio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
